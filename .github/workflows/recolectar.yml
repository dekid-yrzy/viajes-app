name: Recolectar precios

on:
  schedule:
    - cron: "17 11 * * *"  # ~08:17 en Chile (horario de verano); minuto no redondo para evitar la congestión del cron
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Recolector
        run: python -m recolector
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Guardar datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git status --short
          git diff --cached --quiet || (git commit -m "Datos $(date -u +%F)" && git pull --rebase && git push)
