name: Diagnóstico fast-flights (temporal)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "fast-flights==2.2" "primp==0.15.0"
      - run: python -m scripts.diagnostico_fast_flights
