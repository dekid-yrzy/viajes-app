name: Diagnóstico SerpApi (temporal)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m scripts.diagnostico_serpapi
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
